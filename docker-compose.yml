version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spm-backend
    volumes:
      - ./backend:/app
      - ./data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      - "traefik.http.routers.spm-backend.rule=Host(`px.spil.co.id`) && PathPrefix(`/spm-backend`)"
      - "traefik.http.routers.spm-backend.entrypoints=websecure"
      - "traefik.http.routers.spm-backend.tls=true"
      - "traefik.http.routers.spm-backend-pe.rule=Host(`pe.spil.co.id`) && PathPrefix(`/spm-backend`)"
      - "traefik.http.routers.spm-backend-pe.entrypoints=websecure"
      - "traefik.http.routers.spm-backend-pe.tls=true"
      - "traefik.http.routers.spm-backend-pe.service=spm-backend"

      - "traefik.http.services.spm-backend.loadbalancer.server.port=5000"

      - "traefik.http.middlewares.spm-backend-strip.stripprefix.prefixes=/spm-backend"
      - "traefik.http.routers.spm-backend.middlewares=spm-backend-strip"
      - "traefik.http.routers.spm-backend-pe.middlewares=spm-backend-strip"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - DB_HOST=10.128.0.13
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-spm}
      - EMAIL_SENDER=notif.pe@spil.co.id
      - EMAIL_PASSWORD=hWN-5j_jDx
      - EMAIL_RECIPIENTS=abduh.amrullah@spil.co.id
      - API_BASE_URL_PUSAT=http://nanika.spil.co.id:3021
      - API_BASE_URL_IT=http://192.168.1.218:3773
      - JWT_SECRET_KEY=5e38010fb872141a82636467b98c5915
      - CORS_ALLOWED_ORIGINS=https://pe.spil.co.id,https://px.spil.co.id,http://localhost:5173
    command: python app.py
    restart: unless-stopped
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spm-scheduler
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-spm}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@database:5432/${DB_NAME:-spm}
      - EMAIL_SENDER=notif.pe@spil.co.id
      - EMAIL_PASSWORD=hWN-5j_jDx
      - EMAIL_RECIPIENTS=abduh.amrullah@spil.co.id
      - API_BASE_URL_PUSAT=http://nanika.spil.co.id:3021
      - API_BASE_URL_IT=${API_BASE_URL_IT}
    env_file:
      - ./backend/.env
    command: python -m scripts.scheduler
    restart: unless-stopped
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spm-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"

      - "traefik.http.routers.spm-frontend.rule=Host(`pe.spil.co.id`) && PathPrefix(`/spm`)"
      - "traefik.http.routers.spm-frontend.entrypoints=websecure"
      - "traefik.http.routers.spm-frontend.tls=true"

      - "traefik.http.services.spm-frontend.loadbalancer.server.port=5173"
    environment:
      - VITE_API_BASE_URL=https://pe.spil.co.id/spm-backend/api
      - JWT_SECRET_KEY=5e38010fb872141a82636467b98c5915
    restart: unless-stopped
    networks:
      - traefik-net

volumes:
  postgres_data:
    name: spm_postgres_data

networks:
  traefik-net:
    external: true
