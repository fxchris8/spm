version: "3.8"

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: spm-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-spm}
    restart: unless-stopped
    networks:
      - spm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Flask)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spm-backend
    ports:
      - "18037:5000"
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-spm}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@database:5432/${DB_NAME:-spm}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_RECIPIENTS=${EMAIL_RECIPIENTS}
      - API_BASE_URL_PUSAT=${API_BASE_URL_PUSAT}
      - API_BASE_URL_IT=${API_BASE_URL_IT}
    env_file:
      - ./backend/.env
    command: python app.py
    restart: unless-stopped
    networks:
      - spm-net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Scheduler (Background Task for Data Sync)
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spm-scheduler
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-spm}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@database:5432/${DB_NAME:-spm}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_RECIPIENTS=${EMAIL_RECIPIENTS}
      - API_BASE_URL_PUSAT=${API_BASE_URL_PUSAT}
      - API_BASE_URL_IT=${API_BASE_URL_IT}
    env_file:
      - ./backend/.env
    command: python -m scripts.scheduler
    restart: unless-stopped
    networks:
      - spm-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: spm-frontend
    ports:
      - "8047:5173" # Development mode
      # - "8047:80"   # Production mode (uncomment if using production target)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:18037/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - spm-net

volumes:
  postgres_data:
    name: spm_postgres_data

networks:
  spm-net:
    name: spm-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.3.0/24
          gateway: 172.19.3.1
